# Flyway
#spring.flyway.enabled=false

# JPA
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# Configuracoes da AWS para evitar o erro de regiao no S3
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=test
spring.cloud.aws.credentials.secret-key=test

# Caso precise desabilitar a verificacao de endpoint (comum em testes locais/LocalStack)
# spring.cloud.aws.s3.endpoint=http://localhost:4566

# AWS_S3
aws.s3.bucket.name=test-bucket

# Log
logging.level.br.com.alura=DEBUG

# Message
message.market-place.queue-exchange=market-place-queue-exchange
message.market-place.dlq-exchange=market-place-dlq-exchange
message.cadastro-produto.queue-name=cadastro-produto-queue
message.cadastro-produto.dlq-name=cadastro-produto-dlq
message.cadastro-produto.routing-key=cadastro-produto-routing-key

# Rest API
external-api.rest.petstore.url=http://localhost:9090/petstore